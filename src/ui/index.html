<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <title>Selkies Desk</title>
  <link rel="stylesheet" href="style.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-i18n-attr="aria-label:ui.connectionManager">
      <div class="sidebar-top drag"><span class="brand"><span class="brand-mark" data-icon="monitor"></span><strong>Selkies Desk</strong></span></div>
      <div class="sidebar-tools">
        <div class="search"><span data-icon="search"></span><input id="search" data-i18n-attr="aria-label:ui.search;placeholder:ui.searchPlaceholder" autocomplete="off"></div>
        <button id="new" class="primary full"><span data-icon="plus"></span><span data-i18n="ui.new"></span></button>
      </div>
      <div class="list-label"><span data-i18n="ui.allConnections"></span><span id="count"></span></div>
      <nav id="connections" data-i18n-attr="aria-label:ui.serverList"></nav>
      <div class="sidebar-bottom">
        <button id="open-settings" class="nav-item" data-i18n-attr="aria-label:ui.settings"><span data-icon="settings"></span><span data-i18n="ui.settings"></span></button>
        <span id="version" class="version"></span>
      </div>
    </aside>
    <main>
      <header class="main-header drag">
        <button id="toggle-sidebar" class="icon-button"></button>
        <div class="heading"><h1 id="title"></h1><p id="address"></p></div>
        <span class="status"><i id="status-dot"></i><span id="status"></span></span>
        <div class="actions">
          <button id="settings" class="icon-button" data-i18n-attr="aria-label:ui.connectionSettings;title:ui.connectionSettings" disabled></button>
          <button id="reconnect" class="icon-button" data-i18n-attr="aria-label:ui.reconnect" disabled></button>
          <button id="disconnect" class="icon-button" data-i18n-attr="aria-label:ui.disconnect;title:ui.disconnect" disabled></button>
          <button id="connect" class="icon-button primary" data-i18n-attr="aria-label:ui.connect;title:ui.connect" disabled></button>
          <span class="action-divider"></span>
          <button id="focus" class="icon-button" data-i18n-attr="aria-label:ui.focus"></button>
          <button id="fullscreen" class="icon-button"></button>
          <button id="toggle-toolbar" class="icon-button" data-i18n-attr="aria-label:ui.hideToolbar"></button>
        </div>
      </header>
      <div class="strip drag">
        <span id="strip-title"></span>
        <span class="spacer"></span>
        <div class="strip-actions">
          <button id="strip-restore" class="icon-button"></button>
          <button id="strip-sidebar" class="icon-button"></button>
          <button id="strip-toolbar" class="icon-button"></button>
          <span class="action-divider"></span>
          <button id="strip-fullscreen" class="icon-button"></button>
          <button id="strip-reconnect" class="icon-button"></button>
          <button id="strip-disconnect" class="icon-button"></button>
        </div>
      </div>
      <section class="desktop" aria-live="polite">
        <div id="connection-state" class="connection-state" hidden>
          <h2 id="state-title"></h2>
          <p id="state-detail"></p>
          <div class="state-actions">
            <button id="state-connect" class="primary"></button>
            <button id="state-stop" data-i18n="ui.stop"></button>
          </div>
        </div>
        <div id="home" class="home">
          <h2 class="home-title" data-i18n="ui.connections"></h2>
          <div id="devices" class="device-grid"></div>
          <p id="no-match" class="no-match" data-i18n="ui.noMatch" hidden></p>
          <div id="no-devices" class="no-devices">
            <span data-icon="monitor" class="empty-icon"></span>
            <h3 data-i18n="ui.emptyTitle"></h3>
            <p data-i18n="ui.emptyHint"></p>
            <button id="empty-new" class="primary" data-i18n="ui.addFirst"></button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <div id="toast" role="status" hidden></div>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="connection-form">
      <h2 id="editor-title"></h2>
      <div class="form-grid">
        <label class="wide"><span data-i18n="editor.name"></span><input name="name" required maxlength="80" data-i18n-attr="placeholder:editor.namePlaceholder"></label>
        <label class="wide"><span data-i18n="editor.url"></span><input name="url" required maxlength="2048" placeholder="https://server.example:8443" spellcheck="false"></label>
        <p id="http-warning" class="warning wide" data-i18n="editor.httpWarning" hidden></p>
        <label><span data-i18n="editor.group"></span><input name="group" maxlength="60" data-i18n-attr="placeholder:editor.groupPlaceholder"></label>
        <label><span data-i18n="editor.username"></span><input name="username" maxlength="200" autocomplete="off" data-i18n-attr="placeholder:editor.usernamePlaceholder"></label>
        <label class="wide"><span data-i18n="editor.notes"></span><textarea name="notes" maxlength="1000" rows="2"></textarea></label>
        <label class="checkbox wide"><input type="checkbox" name="fullscreen"><span data-i18n="editor.fullscreen"></span></label>
        <label class="checkbox wide"><input type="checkbox" name="autoConnect"><span data-i18n="editor.autoConnect"></span></label>
      </div>
      <div id="security-settings" class="security-settings" hidden>
        <div><span id="password-status"></span><button type="button" id="clear-password" data-i18n="editor.clearPassword"></button></div>
        <div><span id="certificate-status"></span><button type="button" id="revoke-certificate" data-i18n="editor.revoke"></button></div>
      </div>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="delete" class="danger" data-i18n="editor.delete" hidden></button><span class="spacer"></span><button type="button" id="editor-cancel" data-i18n="ui.cancel"></button><button type="submit" class="primary" data-i18n="editor.save"></button></div>
    </form>
  </dialog>

  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title" data-i18n="delete.title"></h2>
    <p id="delete-name"></p>
    <p class="help" data-i18n="delete.help"></p>
    <div class="dialog-actions"><button id="keep" data-i18n="delete.keep"></button><button id="delete-confirm" class="danger-solid" data-i18n="delete.confirm"></button></div>
  </dialog>

  <dialog id="auth-dialog" aria-labelledby="auth-title">
    <form id="auth-form">
      <h2 id="auth-title" data-i18n="auth.title"></h2>
      <p id="auth-origin" class="origin"></p>
      <p id="auth-retry" class="warning" data-i18n="auth.retry" hidden></p>
      <label><span data-i18n="auth.username"></span><input id="auth-username" required maxlength="200" autocomplete="off"></label>
      <label><span data-i18n="auth.password"></span><input id="auth-password" type="password" maxlength="4096" autocomplete="off"></label>
      <label class="checkbox"><input type="checkbox" id="remember"><span data-i18n="auth.remember"></span></label>
      <p id="encryption-note" class="help"></p>
      <div class="dialog-actions"><button type="button" id="auth-cancel" data-i18n="auth.cancel"></button><button class="primary" type="submit" data-i18n="auth.login"></button></div>
    </form>
  </dialog>

  <dialog id="certificate-dialog" aria-labelledby="certificate-title">
    <h2 id="certificate-title" data-i18n="cert.title"></h2>
    <p data-i18n="cert.body"></p>
    <dl>
      <dt data-i18n="cert.origin"></dt><dd data-testid="certificate-origin" id="certificate-origin"></dd>
      <dt data-i18n="cert.fingerprint"></dt><dd data-testid="certificate-fingerprint" id="certificate-fingerprint" class="fingerprint"></dd>
      <dt data-i18n="cert.names"></dt><dd id="certificate-names"></dd>
      <dt data-i18n="cert.error"></dt><dd id="certificate-error"></dd>
    </dl>
    <div class="dialog-actions"><button id="certificate-deny" data-i18n="cert.deny"></button><button class="primary" id="certificate-accept" data-i18n="cert.accept"></button></div>
  </dialog>

  <dialog id="settings-dialog" class="settings" aria-labelledby="settings-title">
    <aside class="settings-nav">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <div role="tablist" aria-orientation="vertical">
        <button role="tab" data-pane="general"><span data-icon="settings"></span><span data-i18n="settings.general"></span></button>
        <button role="tab" data-pane="session"><span data-icon="monitor"></span><span data-i18n="settings.session"></span></button>
        <button role="tab" data-pane="shortcuts"><span data-icon="keyboard"></span><span data-i18n="settings.shortcuts"></span></button>
        <button role="tab" data-pane="data"><span data-icon="data"></span><span data-i18n="settings.data"></span></button>
      </div>
      <span class="spacer"></span>
      <span id="build" class="help"></span>
    </aside>
    <div class="settings-body">
      <section role="tabpanel" data-pane="general">
        <label class="setting"><span data-i18n="settings.language"></span>
          <select id="set-language"><option value="system" data-i18n="settings.languageSystem"></option><option value="zh">简体中文</option><option value="en">English</option></select>
        </label>
        <label class="setting"><span data-i18n="settings.theme"></span>
          <select id="set-theme"><option value="system" data-i18n="settings.themeSystem"></option><option value="light" data-i18n="settings.themeLight"></option><option value="dark" data-i18n="settings.themeDark"></option></select>
        </label>
      </section>
      <section role="tabpanel" data-pane="session" hidden>
        <label class="setting"><span data-i18n="settings.autoFocus"></span><input type="checkbox" class="switch" id="set-autoFocus"></label>
        <label class="setting"><span data-i18n="settings.autoReconnect"></span><input type="checkbox" class="switch" id="set-autoReconnect"></label>
        <label class="setting"><span><span data-i18n="settings.thumbnails"></span><small data-i18n="settings.thumbnailsHelp"></small></span><input type="checkbox" class="switch" id="set-thumbnails"></label>
        <label class="setting"><span><span data-i18n="settings.passSystemKeys"></span><small data-i18n="settings.passSystemKeysHelp"></small></span><input type="checkbox" class="switch" id="set-passSystemKeys"></label>
      </section>
      <section role="tabpanel" data-pane="shortcuts" hidden>
        <p class="help" data-i18n="settings.shortcutsHelp"></p>
        <div id="shortcut-list" class="shortcut-list"></div>
        <p id="shortcut-error" class="error" role="alert"></p>
      </section>
      <section role="tabpanel" data-pane="data" hidden>
        <p class="help" data-i18n="settings.dataHelp"></p>
        <div class="button-row"><button id="import" data-i18n="settings.import"></button><button id="export" data-i18n="settings.export"></button></div>
      </section>
      <div class="dialog-actions"><button id="settings-close" class="primary" data-i18n="ui.close"></button></div>
    </div>
  </dialog>

  <dialog id="switcher" data-i18n-attr="aria-label:switcher.title">
    <input id="switcher-input" data-i18n-attr="aria-label:switcher.title;placeholder:switcher.placeholder" autocomplete="off" spellcheck="false">
    <div id="switcher-list" role="listbox"></div>
  </dialog>
</body>
</html>
